<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Deliberately not indexed. Nothing here is meant to be found by search. -->
<meta name="robots" content="noindex, nofollow">
<title>Viget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='16' r='11' fill='%231496bb'/%3E%3Cpath d='M14 16 L14 5 A11 11 0 0 1 23.53 21.5 Z' fill='%23f26d21' transform='translate(1.4 -1.4)'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --ink: #092f40;
    --muted: #6b7280;
    --rule: #e5e7eb;
    --link: #1496bb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1b24;
      --ink: #e8eef2;
      --muted: #94a3b0;
      --rule: #1e3442;
      --link: #4fb8d8;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    text-align: center;
    max-width: 22rem;
  }

  svg.mark {
    width: 64px;
    height: 64px;
    display: block;
    margin: 0 auto 1.75rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 0 0 0.5rem;
  }

  h1 .os { color: #f26d21; }

  p {
    margin: 0 0 1.75rem;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.6;
  }

  a {
    color: var(--link);
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid transparent;
    padding-bottom: 1px;
    transition: border-color 120ms ease;
  }

  a:hover, a:focus-visible { border-bottom-color: currentColor; }

  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 0 auto 1.75rem;
    width: 3rem;
  }
</style>
</head>
<body>
  <main>
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <path d="M44 72 L72.98 64.24 A30 30 0 0 1 21.02 91.28 Z" fill="#1496bb"></path>
      <path d="M44 72 L21.02 91.28 A30 30 0 0 1 51.77 43.02 Z" fill="#0d5f78"></path>
      <path d="M44 72 L51.77 43.02 A30 30 0 0 1 72.98 64.24 Z" fill="#f26d21" transform="translate(3.5 -3.5)"></path>
      <circle cx="88" cy="34" r="15" fill="#f26d21"></circle>
    </svg>

    <h1>Viget<span class="os">OS</span></h1>
    <p>A Viget domain.</p>
    <hr>
    <a href="https://www.viget.com">viget.com</a>
  </main>
</body>
</html>
